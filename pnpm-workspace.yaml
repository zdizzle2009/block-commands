allowBuilds:
  '@parcel/watcher': false
  esbuild: false
  sharp: true
minimumReleaseAge: 2880 # Security: Wait 2 days (2880 minutes) before installing newly released packages
minimumReleaseAgeExclude:
  # Renovate security update: astro@7.1.0
  - astro@7.1.0
  # Renovate security update: @astrojs/netlify@8.1.2
  - "@astrojs/netlify@8.1.2"
